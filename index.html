<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>得交換土地勾選地圖</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{color-scheme:light;--bg:#f6f5f1;--card:#fff;--ink:#1f2328;--ink2:#4b5260;--mute:#7a808c;--line:#e3e1da;--line2:#cfccc2;
  --navy:#1f3a5f;--navy2:#2f5584;--top:#2e7d4f;--topbg:#e2efda;--sel:#1f5fbf;--selbg:#e3edfb;--warn:#8a6100;--warnbg:#fff2cc}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14.5px/1.6 "Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,select,input,textarea{font:inherit}
header{background:#fff;border-bottom:1px solid var(--line);padding:8px 14px;display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap}
header h1{margin:0;font-size:17px;color:var(--navy);white-space:nowrap}
header label{font-size:13.5px;color:var(--ink2);display:flex;gap:6px;align-items:center}
header select,header input{border:1px solid var(--line2);border-radius:7px;padding:4px 8px;background:#fff;color:var(--ink)}
header input{width:110px}
.sp{flex:1}
.cnt{font-size:14px;font-weight:600}
.cnt.ok{color:var(--top)} .cnt.no{color:var(--warn)}
.btn{border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:8px;padding:6px 14px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--navy2)}
.btn.ghost{background:#fff;color:var(--navy)}
main{flex:1;display:grid;grid-template-columns:440px minmax(0,1fr);min-height:0}
#side{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:#fff}
.tools{padding:8px 12px;border-bottom:1px solid var(--line);display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center;font-size:13.5px}
.tools select{border:1px solid var(--line2);border-radius:7px;padding:3px 6px;background:#fff}
.tools label{display:flex;gap:4px;align-items:center;color:var(--ink2)}
.note{padding:8px 12px;font-size:13px;color:var(--ink2);background:#faf8f2;border-bottom:1px solid var(--line)}
.note b{color:var(--ink)}
#list{flex:1;overflow:auto;min-height:0}
.row{display:grid;grid-template-columns:28px 44px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:#f7f6f1}
.row.cur{background:var(--selbg)}
.row.top .rk{background:var(--top);color:#fff}
.rk{font-size:12.5px;font-weight:700;text-align:center;border-radius:5px;background:#eceae3;padding:1px 0;font-variant-numeric:tabular-nums}
.row input[type=checkbox]{width:18px;height:18px;accent-color:var(--sel)}
.row .t{font-weight:600;line-height:1.35}
.row .m{font-size:12.5px;color:var(--mute);line-height:1.4}
.row .f{font-size:12px;color:var(--ink2);text-align:right;white-space:nowrap;line-height:1.4}
.row .done{color:var(--top);font-weight:600}
#detail{border-top:2px solid var(--navy);padding:10px 12px;max-height:48%;overflow:auto;background:#fff}
#detail h3{margin:0 0 4px;font-size:15.5px;color:var(--navy)}
#detail .kv{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:2px 10px;font-size:13px;margin:0 0 8px}
#detail .kv span:nth-child(odd){color:var(--mute)}
#detail .q{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:4px 8px;align-items:center;font-size:13.5px}
#detail .q select{border:1px solid var(--line2);border-radius:6px;padding:2px 4px;background:#fff}
#detail .q select.set{background:var(--topbg);border-color:#9bc8a8}
#detail textarea{width:100%;border:1px solid var(--line2);border-radius:7px;padding:4px 8px;margin-top:6px;min-height:36px;resize:vertical}
#detail .pick{display:flex;gap:8px;align-items:center;margin:6px 0;font-weight:600}
#detail .pick input{width:18px;height:18px;accent-color:var(--sel)}
#detail .empty{color:var(--mute);font-size:13.5px}
#map{min-height:0;background:#e8e6df}
.legend{background:#fff;padding:6px 10px;border-radius:7px;font-size:12.5px;line-height:1.7;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.legend i{display:inline-block;width:14px;height:10px;margin-right:6px;border:2px solid;vertical-align:-1px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:8px;padding:8px 16px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:2000}
.toast.on{opacity:1}
.nodata{padding:30px 16px;color:var(--mute);text-align:center}
@media (max-width:820px){
  body{overflow:auto;height:auto}
  main{grid-template-columns:minmax(0,1fr);grid-template-rows:55vh auto}
  #map{order:-1;height:55vh}
  #side{border-right:0}
  #list{max-height:50vh}
  #detail{max-height:none}
  header input{width:96px}
}
@media print{body{background:#fff}}
</style>
</head>

<header>
  <h1>得交換土地勾選地圖</h1>
  <label>管理處 <select id="unit"></select></label>

  <span class="cnt" id="cnt"></span>
  <span class="sp"></span>
  <button class="btn ghost" id="help">說明</button>
  <button class="btn" id="exp">匯出 CSV</button>
</header>
<main>
  <div id="side">
    <div class="tools">

      <label><input type="checkbox" id="onlyTop">只看前 10</label>

    <div class="note" id="note"></div>
    <div id="list"></div>
    <div id="detail"><div class="empty">點清單或地圖上的土地，在這裡填寫確認事項。</div></div>
  </div>
  <div id="map"></div>
</main>
<div class="toast" id="toast"></div>

  const head = ['管理處','填表人','聯絡電話','匯出時間','排序一','工作站','縣市','鄉鎮市區','地段','地號','財產編號','地段號14碼','登記面積（㎡）','使用地類別','選入'].concat(QS.map(q=>q[1]),['備註']);
  const rows = [head];
  const stamp = (now.getFullYear()-1911)+'.'+String(now.getMonth()+1).padStart(2,'0')+'.'+String(now.getDate()).padStart(2,'0')+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  feats.slice().sort((a,b)=>a.properties['排序一']-b.properties['排序一']).forEach(f => {
    const p = f.properties, s = st[p.key] || {};
    const touched = s.sel || QS.some(q=>s[q[0]]) || s.memo;
    if (!touched) return;
    rows.push([unit, meta.who, meta.tel, stamp, p['排序一'], p['工作站'], p['縣市名稱'], p['鄉鎮市區名稱'], p['地段名稱'], p['地號'], p['財產編號'], p.key,
               p['登記面積_n'], p['非都土地使用編定'], s.sel ? '選入' : ''].concat(QS.map(q=>s[q[0]]||''), [s.memo||'']));
  });
  return '﻿' + rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
}

if (typeof document !== 'undefined') (function(){
  const $ = s => document.querySelector(s);
  const h = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const fmt = n => (n==null||n==='')?'':Number(n).toLocaleString('zh-TW',{maximumFractionDigits:2});
  const KEY = 'triwra-exchange-pick-v1:';
  let unit = '', feats = [], st = {}, cur = null, layers = {};
  const load = u => { try { return JSON.parse(localStorage.getItem(KEY+u)) || {s:{},who:'',tel:''}; } catch(e){ return {s:{},who:'',tel:''}; } };
  const save = () => { try { localStorage.setItem(KEY+unit, JSON.stringify({s:st, who:$('#who').value, tel:$('#tel').value})); } catch(e){} };
  function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('on'),2200); }

  // map
  const map = L.map('map', {zoomControl:true, preferCanvas:false}).setView([24.55,120.85], 11);
  const emap = L.tileLayer('https://wmts.nlsc.gov.tw/wmts/EMAP/default/GoogleMapsCompatible/{z}/{y}/{x}', {maxZoom:20, maxNativeZoom:19, attribution:'內政部國土測繪中心'});
  const photo = L.tileLayer('https://wmts.nlsc.gov.tw/wmts/PHOTO2/default/GoogleMapsCompatible/{z}/{y}/{x}', {maxZoom:20, maxNativeZoom:19, attribution:'內政部國土測繪中心'});
  const sect = L.tileLayer('https://wmts.nlsc.gov.tw/wmts/LANDSECT/default/GoogleMapsCompatible/{z}/{y}/{x}', {maxZoom:20, maxNativeZoom:19, opacity:.8});
  photo.addTo(map);
  L.control.layers({'正射影像':photo,'電子地圖':emap}, {'地段界':sect}, {collapsed:false}).addTo(map);
  const lg = L.control({position:'bottomright'});
  lg.onAdd = () => { const d = L.DomUtil.create('div','legend'); d.innerHTML = '<div><i style="border-color:#2e7d4f;background:rgba(46,125,79,.25)"></i>前 10 優先</div><div><i style="border-color:#f08a24;background:rgba(240,138,36,.2)"></i>其他備選</div><div><i style="border-color:#1f5fbf;background:rgba(31,95,191,.45)"></i>已選入</div>'; return d; };
  lg.addTo(map);
  const geo = L.geoJSON(null, {style: styleOf, onEachFeature:(f,l)=>{ layers[f.properties.key]=l; l.on('click',()=>focus(f.properties.key,false)); l.bindTooltip(f.properties['地段名稱']+' '+f.properties['地號'], {sticky:true}); }}).addTo(map);
  const dots = L.layerGroup().addTo(map); let dotOf = {};
  function dotStyle(f){ const s = styleOf(f); return {radius: cur===f.properties.key?8:6, color:'#fff', weight:1.5, fillColor:s.color, fillOpacity:.95}; }
  function toggleDots(){ if (map.getZoom() < 15) { if (!map.hasLayer(dots)) map.addLayer(dots); } else if (map.hasLayer(dots)) map.removeLayer(dots); }
  map.on('zoomend', toggleDots);
  function restyle(k){ if (layers[k]) layers[k].setStyle(styleOf(layers[k].feature)); if (dotOf[k]) dotOf[k].setStyle(dotStyle(layers[k].feature)); }
  function styleOf(f){
    const s = st[f.properties.key]||{}, isCur = cur===f.properties.key;
    if (s.sel) return {color:'#1f5fbf', weight:isCur?4:2.5, fillColor:'#1f5fbf', fillOpacity:.45};
    if (f.properties['前10']) return {color:'#2e7d4f', weight:isCur?4:2.5, fillColor:'#2e7d4f', fillOpacity:.25};
    return {color:'#f08a24', weight:isCur?4:2, fillColor:'#f08a24', fillOpacity:.2};
  }

  // units
  const units = DATA.units;
  $('#unit').innerHTML = '<option value="">— 請選擇 —</option>' + units.map(u => '<option value="'+h(u)+'"'+(DATA.data[u]?'':' disabled')+'>'+h(u)+(DATA.data[u]?'':'（尚未提供）')+'</option>').join('');

  function setUnit(u){
    unit = u; cur = null; layers = {}; geo.clearLayers();
    feats = u && DATA.data[u] ? DATA.data[u].features : [];
    const sv = u ? load(u) : {s:{},who:'',tel:''}; st = sv.s || {}; $('#who').value = sv.who||''; $('#tel').value = sv.tel||'';
    const stns = [...new Set(feats.map(f=>f.properties['工作站']))].sort();
    $('#stn').innerHTML = '<option value="">全部</option>' + stns.map(s=>'<option>'+h(s)+'</option>').join('');
    dots.clearLayers(); dotOf = {};
    if (feats.length){ geo.addData({type:'FeatureCollection', features:feats});
      Object.entries(layers).forEach(([k,l]) => { const m = L.circleMarker(l.getBounds().getCenter(), dotStyle(l.feature)); m.on('click',()=>focus(k,true)); m.bindTooltip(l.feature.properties['地段名稱']+' '+l.feature.properties['地號']); dots.addLayer(m); dotOf[k]=m; });
      map.fitBounds(geo.getBounds(), {padding:[20,20]}); toggleDots(); }
    $('#note').innerHTML = u ? (DATA.data[u] ? '共 <b>'+feats.length+'</b> 筆備選。請勾選 <b>5～10 筆</b>選入，並逐筆填寫確認事項；綠色為依附表二排序之前 10 筆。資料建置 '+h(DATA.data[u].built)+'。' : '本處資料尚未提供。') : '請先在上方選擇管理處。';
    try { localStorage.setItem(KEY+'lastUnit', u); } catch(e){}
    renderList(); renderDetail(); count();
  }
  function count(){
    const n = Object.values(st).filter(s=>s.sel).length;
    const el = $('#cnt'); el.textContent = unit ? '已選入 '+n+' 筆' : ''; el.className = 'cnt '+(n>=5&&n<=10?'ok':'no');
  }
  function filtered(){
    const sk = $('#sort').value, stn = $('#stn').value, ot = $('#onlyTop').checked, os = $('#onlySel').checked;
    return feats.filter(f => (!stn || f.properties['工作站']===stn) && (!ot || f.properties['前10']) && (!os || (st[f.properties.key]||{}).sel))
                .sort((a,b)=>a.properties[sk]-b.properties[sk]);
  }
  function renderList(){
    if (!unit){ $('#list').innerHTML = '<div class="nodata">請先選擇管理處</div>'; return; }
    const sk = $('#sort').value;
    $('#list').innerHTML = filtered().map(f => { const p = f.properties, s = st[p.key]||{}, filled = QS.filter(q=>s[q[0]]).length;
      return '<div class="row'+(p['前10']?' top':'')+(cur===p.key?' cur':'')+'" data-k="'+h(p.key)+'"><input type="checkbox"'+(s.sel?' checked':'')+' title="選入"><span class="rk" title="'+sk+'">'+p[sk]+'</span>'
        +'<div><div class="t">'+h(p['地段名稱'])+' '+h(p['地號'])+'</div><div class="m">'+h(p['工作站'])+'．'+h(p['鄉鎮市區名稱'])+'．'+h(p['非都土地使用編定'])+'．'+fmt(p['登記面積_n'])+' ㎡</div></div>'
        +'<div class="f">附表二 '+p['附表二符合項數']+'/3<br>地價 '+fmt(p['公告地價_n'])+'<br>'+(filled?'<span class="done">已填 '+filled+'/'+QS.length+'</span>':'')+'</div></div>'; }).join('') || '<div class="nodata">沒有符合條件的土地</div>';
  }
  function renderDetail(){
    const d = $('#detail');
    const f = feats.find(x=>x.properties.key===cur);
    if (!f){ d.innerHTML = '<div class="empty">點清單或地圖上的土地，在這裡填寫確認事項。</div>'; return; }
    const p = f.properties, s = st[p.key] || (st[p.key] = {});
    const ind = [p['指標1未臨路']?'①未臨路':'', p['指標2車站300m外']?'②車站300m外':'', p['指標4坵形不規則']?'④坵形不規則':''].filter(Boolean).join('、') || '無';
    d.innerHTML = '<h3>'+h(p['地段名稱'])+' '+h(p['地號'])+'　<small style="color:var(--mute);font-weight:400">排序一第 '+p['排序一']+' 名</small></h3>'
      + '<div class="kv"><span>工作站</span><span>'+h(p['工作站'])+'</span><span>鄉鎮</span><span>'+h(p['縣市名稱']+p['鄉鎮市區名稱'])+'</span>'
      + '<span>面積</span><span>'+fmt(p['登記面積_n'])+' ㎡</span><span>使用地</span><span>'+h(p['非都土地使用分區']+'／'+p['非都土地使用編定'])+'</span>'
      + '<span>公告地價</span><span>'+fmt(p['公告地價_n'])+' 元／㎡</span><span>公告現值總額</span><span>'+fmt(p['公告現值總額'])+' 元</span>'
      + '<span>距圳路</span><span>'+fmt(p['距圳路中心線_m'])+' m</span><span>財產編號</span><span>'+h(p['財產編號'])+'</span>'
      + '<span>附表二</span><span style="grid-column:2/-1">'+ind+'</span></div>'
      + '<label class="pick"><input type="checkbox" id="dsel"'+(s.sel?' checked':'')+'>選入（提報候選）</label>'
      + '<button class="btn ghost" id="dall" type="button" style="width:100%;margin:2px 0 8px;padding:4px 10px;font-size:13.5px">一鍵確認：確屬非事業用，且無§5一、五、六、七款情形（只填空白項）</button>'
      + '<div class="q">' + QS.map(q => '<span>'+q[1]+'</span><select data-q="'+q[0]+'"'+(s[q[0]]?' class="set"':'')+'>'+ANS.map(a=>'<option'+(s[q[0]]===a?' selected':'')+' value="'+a+'">'+(a||'—')+'</option>').join('')+'</select>').join('') + '</div>'
      + '<textarea id="dmemo" placeholder="備註（選填）">'+h(s.memo||'')+'</textarea>';
    $('#dsel').onchange = e => { s.sel = e.target.checked; changed(p.key); };
    $('#dall').onclick = () => { let n = 0; QS.forEach(q => { if (!s[q[0]]) { s[q[0]] = q[0]==='nb' ? '是' : '否'; n++; } }); changed(p.key); toast(n ? '已填入 '+n+' 項' : '五項都已填寫，未變更'); };
    d.querySelectorAll('select[data-q]').forEach(el => el.onchange = e => { s[el.dataset.q] = e.target.value; el.classList.toggle('set', !!e.target.value); changed(p.key, true); });
    $('#dmemo').oninput = e => { s.memo = e.target.value; save(); };
  }
  function changed(k, keepDetail){
    save(); count(); restyle(k);
    const y = $('#list').scrollTop; renderList(); $('#list').scrollTop = y; if (!keepDetail) renderDetail();
  }
  function focus(k, zoom){
    const prev = cur; cur = k;
    if (prev) restyle(prev);
    restyle(k); if (layers[k]){ layers[k].bringToFront(); if (zoom) map.fitBounds(layers[k].getBounds(), {maxZoom:19, padding:[60,60]}); }
    const y = $('#list').scrollTop; renderList(); $('#list').scrollTop = y; renderDetail();
    const row = document.querySelector('.row[data-k="'+CSS.escape(k)+'"]'); if (row && !zoom) row.scrollIntoView({block:'nearest'});
  }
  $('#list').addEventListener('click', e => { const r = e.target.closest('.row'); if (!r) return; const k = r.dataset.k;
    if (e.target.type==='checkbox'){ (st[k] = st[k]||{}).sel = e.target.checked; changed(k); return; }
    focus(k, true); });
  ['#stn','#sort','#onlyTop','#onlySel'].forEach(s => $(s).addEventListener('change', renderList));
  $('#unit').addEventListener('change', e => setUnit(e.target.value));
  ['#who','#tel'].forEach(s => $(s).addEventListener('input', save));
  $('#exp').addEventListener('click', () => {
    if (!unit){ toast('請先選擇管理處'); return; }
    const n = Object.values(st).filter(s=>s.sel).length;
    if (!$('#who').value.trim()){ toast('請填寫填表人'); $('#who').focus(); return; }
    if ((n<5 || n>10) && !confirm('目前選入 '+n+' 筆，建議 5～10 筆。仍要匯出嗎？')) return;
    const now = new Date(), csv = buildCsv(unit, feats, st, {who:$('#who').value.trim(), tel:$('#tel').value.trim()}, now);
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
    a.download = unit+'_得交換土地勾選_'+rocNow(now)+'.csv'; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1500);
    toast('已匯出，請將 CSV 寄回'+(DATA.recipient?'：'+DATA.recipient:'本院承辦人'));
  });
  $('#help').addEventListener('click', () => alert(
    '使用方式\n1. 上方選擇管理處，填寫填表人與聯絡電話。\n2. 清單或地圖點選土地，於左下方確認五項事項（是／否／待查）；全部無疑義者可按「一鍵確認」，只會填入尚未填寫的項目。\n3. 勾選「選入」5～10 筆。\n4. 按「匯出 CSV」，將檔案寄回'+(DATA.recipient?'：'+DATA.recipient:'本院承辦人')+'。\n\n'
    + '備選池篩選方式：依交換辦法草案預告版第五條，排除都市土地、建築用地、交通用地、河川區域、圳路中心線 4 公尺範圍內、有建物及連續長條基金土地。\n'
    + '排序一依附表二參考指標（①未臨路、②鐵路、捷運或輕軌車站 300 公尺外、④坵形不規則）符合項數，同數者公告地價低者在前；前 10 筆由各工作站輪流取其最前者。\n'
    + '勾選內容只存在本機瀏覽器，請以匯出之 CSV 為準。'));
  let last = ''; try { last = localStorage.getItem(KEY+'lastUnit') || ''; } catch(e){}
  if (DATA.default && !last) last = DATA.default;
  if (last && DATA.data[last]){ $('#unit').value = last; setUnit(last); } else setUnit('');
})();
</script>
</body>
</html>
